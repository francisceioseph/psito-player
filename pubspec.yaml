name: psito_player
description: "Player de músicas locais para Linux."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audio_metadata_reader: 1.8.1
  dbus: ^0.8.0
  image: ^4.5.0
  intl: any
  # A libmpv vem do sistema (o libmpv2 do Debian, ver o psito-package). O
  # media_kit_libs_linux só registra o plugin e acerta o LC_NUMERIC.
  media_kit: ^1.2.6
  media_kit_libs_linux: ^1.2.1
  path: ^1.9.0
  # A 2.x abre a libsqlite3 do sistema. A 3.x procura a libsqlite3.so, que no
  # Debian só existe com o -dev, ou baixa uma cópia ao compilar.
  sqlite3: ^2.9.4
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
